name: Test package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install dependencies
        run: |
          uv pip install -e . --group dev

      - name: Run pytest
        run: |
          uv run pytest --version
          uv run pytest -v tests/

  test-detree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: mrzimu/detree-vm
          path: detree-vm
          ref: v0.1.0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
          activate-environment: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install detree-vm
        run: DETREE_SHIP_BACKEND=both uv pip install -e detree-vm
      - name: Install package
        run: uv pip install -e . --group dev
      - name: Run the detree backend and machine tests
        run: uv run pytest -v tests/detree/ tests/test_readers.py::test_detree

  test-build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          activate-environment: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          uv pip install -e . --group docs

      - name: Build docs
        run: |
          uv run sphinx-build -b html docs/ build/html
